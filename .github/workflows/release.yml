name: Release desktop app

# Push a tag like v1.0.0 to build AutoDeck.exe on Windows and attach it to a Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run electron:build
      - name: Publish release with AutoDeck.exe
        uses: softprops/action-gh-release@v2
        with:
          files: release/AutoDeck.exe
          generate_release_notes: true
